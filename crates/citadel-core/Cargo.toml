[package]
name = "citadel-core"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true

# Shared library contracts, application operations and libcalibre conversions.
# Hosts inject URL policy and own locking/platform capabilities; no Tauri or Axum.

[features]
openapi = ["dep:utoipa"]

[dependencies]
chrono = { version = "0.4.31", features = ["serde"] }
utoipa = { version = "6", features = ["chrono"], optional = true }
libcalibre = { path = "../libcalibre" }
serde = { version = "1.0", features = ["derive"] }
# Pinned to src-tauri's specta so the `Type` derive emits identical bindings.
specta = { version = "=2.0.0-rc.22", features = ["derive", "chrono"] }
urlencoding = "2.1.3"

[dev-dependencies]
tempfile = "3.8"
serde_json = "1"
